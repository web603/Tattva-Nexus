<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tattva Nexus - Secure Access</title>
    <!-- Core & Monospace Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* [Styles remain exactly the same as your original provided code] */
        :root {
            --bg-base: #f9fafb;
            --brand-teal: #0fa391;
            --brand-teal-hover: #0d8c7c;
            --brand-dark: #09201a;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-inverse: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.75);
            --input-bg: rgba(255, 255, 255, 0.6);
            --input-border: rgba(203, 213, 225, 0.6);
            --error-color: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.08);
            --success-color: #10b981;
            --success-bg: rgba(16, 185, 129, 0.08);
            --anim-snappy: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-glass: 0 4px 12px rgba(9, 32, 26, 0.02), 0 16px 32px rgba(9, 32, 26, 0.04), 0 32px 64px rgba(9, 32, 26, 0.05), 0 0 40px rgba(15, 163, 145, 0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; position: relative; }
        body::before { content: ''; position: fixed; width: 80vw; height: 80vw; border-radius: 50%; background: var(--brand-teal); filter: blur(140px); opacity: 0.07; top: -20vh; right: -20vw; pointer-events: none; z-index: -1; animation: breathe 12s ease-in-out infinite alternate; }
        @keyframes breathe { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.1) translate(-5%, 5%); } }
        .mono-num { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-variant-numeric: tabular-nums; }
        .split-container { display: flex; flex-direction: column; width: 100%; min-height: 100vh; z-index: 1; }
        .brand-banner { background: linear-gradient(135deg, #0f172a 0%, var(--brand-dark) 100%); color: var(--text-inverse); padding: 3rem 2rem; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
        .logo-wrap { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; }
        .logo-icon { width: 36px; height: 36px; background: var(--brand-teal); border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #fff; }
        .brand-banner h1 { font-size: 2.2rem; line-height: 1.15; font-weight: 800; margin-bottom: 1rem; }
        .workspace { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.2rem; }
        .glass-panel { width: 100%; max-width: 480px; background: var(--glass-bg); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 2.5rem 2rem; box-shadow: var(--shadow-glass); }
        .view-section { display: none; opacity: 0; transition: var(--anim-snappy); }
        .view-section.active { display: block; opacity: 1; animation: slideUpFade 0.35s ease forwards; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .input-group { margin-bottom: 20px; }
        .form-control { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px; padding: 14px 16px; outline: none; }
        .btn { padding: 15px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; width: 100%; }
        .btn-primary { background: var(--brand-teal); color: #fff; }
        .btn-google { background: #fff; border: 1px solid var(--input-border); margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .divider { display: flex; align-items: center; margin: 25px 0; color: var(--text-muted); font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--input-border); }
        .progress-indicator { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; }
        .progress-step { width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 2px solid rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; z-index: 1; }
        .progress-step.active { border-color: var(--brand-teal); color: var(--brand-teal); }
        #status-message { padding: 14px; border-radius: 12px; margin-bottom: 20px; display: none; }
        #status-message.error { background: var(--error-bg); color: var(--error-color); }
        @media (min-width: 992px) { .split-container { flex-direction: row; } .brand-banner, .workspace { flex: 1; } }
    </style>
</head>
<body>

    <div class="split-container">
        <div class="brand-banner">
            <div class="logo-wrap"><div class="logo-icon">T</div>Tattva Nexus</div>
            <h1>Unlock your campus ecosystem.</h1>
            <p>Direct access to student networking and secure freelance gig matching.</p>
        </div>

        <div class="workspace">
            <div class="glass-panel">
                <div id="status-message"></div>

                <!-- LOGIN -->
                <div id="view-login" class="view-section active">
                    <div class="view-header"><h2>Welcome Back</h2><p>Access the Nexus immediately.</p></div>
                    <form id="loginForm">
                        <div class="input-group"><label>Email</label><input type="email" id="loginEmail" class="form-control" required></div>
                        <div class="input-group"><label>Password</label><input type="password" id="loginPassword" class="form-control" required></div>
                        <button type="submit" id="btnLogin" class="btn btn-primary">Sign In</button>
                    </form>
                    <div class="divider">OR</div>
                    <button type="button" id="btnGoogleLogin" class="btn btn-google">Continue with Google</button>
                    <p style="text-align:center; margin-top:20px;">No account? <span style="color:var(--brand-teal); cursor:pointer;" onclick="switchView('view-signup-1')">Sign Up</span></p>
                </div>

                <!-- SIGNUP CONTAINER -->
                <div id="signup-container" style="display: none;">
                    <div class="progress-indicator"><div class="progress-step active" id="ind-1">1</div><div class="progress-step" id="ind-2">2</div><div class="progress-step" id="ind-3">3</div></div>
                    <form id="signupForm">
                        <div id="view-signup-1" class="view-section active">
                            <div class="input-group"><label>Email</label><input type="email" id="regEmail" class="form-control" required></div>
                            <div class="input-group"><label>Password</label><input type="password" id="regPassword" class="form-control" required minlength="6"></div>
                            <button type="button" class="btn btn-primary" onclick="validateAndProceed(1, 2)">Next Step</button>
                        </div>
                        <div id="view-signup-2" class="view-section">
                            <div class="input-group"><label>First Name</label><input type="text" id="regFirstName" class="form-control" required></div>
                            <div class="input-group"><label>College</label><input type="text" id="regCollege" class="form-control" required></div>
                            <button type="button" class="btn btn-primary" onclick="validateAndProceed(2, 3)">Next Step</button>
                        </div>
                        <div id="view-signup-3" class="view-section">
                            <div class="input-group"><label>Skills</label><input type="text" id="regSkills" class="form-control" placeholder="e.g. Coding"></div>
                            <button type="submit" id="btnSignup" class="btn btn-primary">Create Account & Enter</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLo9rfV279AoHGGs3HheHgYQ5EgLcCzJo",
            authDomain: "tattva-nexus.firebaseapp.com",
            projectId: "tattva-nexus",
            storageBucket: "tattva-nexus.firebasestorage.app",
            messagingSenderId: "275334528",
            appId: "1:275334528:web:48a4d050fdb91c1c142d65"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const msgBox = document.getElementById('status-message');

        window.switchView = function(targetId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById('view-login').style.display = 'none';
            document.getElementById('signup-container').style.display = 'none';

            if(targetId === 'view-login') {
                document.getElementById('view-login').style.display = 'block';
                document.getElementById('view-login').classList.add('active');
            } else {
                document.getElementById('signup-container').style.display = 'block';
                document.getElementById('view-signup-1').classList.add('active');
            }
        };

        window.validateAndProceed = function(curr, next) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-signup-${next}`).classList.add('active');
            document.getElementById(`ind-${next}`).classList.add('active');
        };

        // --- LOGIN: REMOVED VERIFICATION CHECK ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
                // ALWAYS ALLOW ENTRY
                window.location.href = "dashboard.html";
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = 'error';
                msgBox.textContent = "Login failed. Please check credentials.";
            }
        });

        // --- SIGNUP: REMOVED VERIFICATION GATE ---
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const cred = await createUserWithEmailAndPassword(auth, document.getElementById('regEmail').value, document.getElementById('regPassword').value);
                await setDoc(doc(db, "users", cred.user.uid), {
                    uid: cred.user.uid,
                    email: cred.user.email,
                    displayName: document.getElementById('regFirstName').value || "User",
                    onboardingCompleted: true, // Mark as true immediately
                    createdAt: Date.now()
                });
                // ALWAYS ALLOW ENTRY
                window.location.href = "dashboard.html";
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = 'error';
                msgBox.textContent = err.message;
            }
        });

        // --- GOOGLE SSO: REMOVED VERIFICATION GATE ---
        document.getElementById('btnGoogleLogin').addEventListener('click', async () => {
            try {
                const cred = await signInWithPopup(auth, googleProvider);
                // Create profile if it doesn't exist, but always redirect to dashboard
                await setDoc(doc(db, "users", cred.user.uid), {
                    uid: cred.user.uid,
                    email: cred.user.email,
                    onboardingCompleted: true 
                }, { merge: true });
                
                window.location.href = "dashboard.html";
            } catch (err) {
                console.error(err);
            }
        });

    </script>
</body>
</html>
