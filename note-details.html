<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Hub | Tattva Nexus</title>
    <style>
        /* =======================================
           GLOBAL VARIABLES & BASE STYLES
           ======================================= */
        :root {
            --bg-color: #f3f4f6;
            --card-color: #ffffff;
            --primary-accent: #1e3a8a;
            --secondary-accent: #3b82f6;
            --text-color: #111827;
            --text-light: #4b5563;
            --border-color: #e5e7eb;
            --sidebar-width: 260px;
            --header-height: 70px;
            --danger-color: #ef4444;
            --star-color: #fbbf24;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =======================================
           SIDEBAR & HEADER
           ======================================= */
        .sidebar {
            width: var(--sidebar-width); 
            background-color: var(--card-color);
            border-right: 1px solid var(--border-color); 
            position: fixed;
            height: 100vh; 
            left: 0; 
            top: 0; 
            display: flex; 
            flex-direction: column; 
            z-index: 100;
        }
        
        .sidebar-logo {
            height: var(--header-height); 
            display: flex; 
            align-items: center; 
            padding: 0 1.5rem;
            font-size: 1.25rem; 
            font-weight: 800; 
            color: var(--primary-accent); 
            border-bottom: 1px solid var(--border-color); 
            cursor: pointer;
        }
        
        .logo-icon {
            width: 32px; 
            height: 32px; 
            background-color: var(--secondary-accent); 
            color: white;
            border-radius: 8px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-right: 10px; 
            font-weight: bold;
        }
        
        .nav-menu { 
            padding: 1.5rem 1rem; 
            display: flex; 
            flex-direction: column; 
            gap: 0.5rem; 
            overflow-y: auto; 
        }
        
        .nav-item {
            display: flex; 
            align-items: center; 
            padding: 0.875rem 1rem; 
            border-radius: 8px;
            color: var(--text-light); 
            font-weight: 500; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        
        .nav-item:hover { 
            background-color: var(--bg-color); 
            color: var(--primary-accent); 
        }
        
        .nav-item.active { 
            background-color: rgba(59, 130, 246, 0.1); 
            color: var(--secondary-accent); 
            border-right: 3px solid var(--secondary-accent); 
        }
        
        .nav-icon { margin-right: 12px; font-size: 1.1rem; }

        .top-header {
            position: fixed; 
            top: 0; 
            left: var(--sidebar-width); 
            right: 0; 
            height: var(--header-height);
            background-color: var(--card-color); 
            border-bottom: 1px solid var(--border-color);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 2rem; 
            z-index: 90;
        }
        
        .page-title { font-size: 1.4rem; font-weight: 700; color: var(--primary-accent); }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-add {
            background-color: var(--secondary-accent);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-add:hover { background-color: var(--primary-accent); }

        /* =======================================
           MAIN CONTENT & FILTERS
           ======================================= */
        .main-content {
            margin-left: var(--sidebar-width);
            margin-top: var(--header-height);
            padding: 2rem;
            width: calc(100% - var(--sidebar-width));
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .filter-btn {
            padding: 0.6rem 1.5rem;
            border: 1px solid var(--primary-accent);
            border-radius: 20px;
            background-color: transparent;
            color: var(--primary-accent);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: var(--primary-accent);
            color: white;
        }

        /* =======================================
           NOTES GRID FEED
           ======================================= */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .note-card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .note-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .note-header {
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .note-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-accent);
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--secondary-accent);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .tag-dept { 
            background-color: #f3f4f6; 
            color: var(--text-light); 
            border: 1px solid var(--border-color); 
        }

        .note-desc {
            font-size: 0.9rem;
            color: var(--text-color);
            margin-bottom: 1.5rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .btn-download {
            background-color: var(--secondary-accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-download:hover { background-color: var(--primary-accent); }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
            font-size: 1.1rem;
            background: var(--card-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        /* =======================================
           PRIME STANDARD 1: HARDCORE CSS MODAL
           ======================================= */
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(8px); 
            z-index: 9998; 
            display: none; 
        }

        .add-entry-modal { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 9999; 
            background: #fff; 
            max-height: 90vh; 
            overflow-y: auto; 
            display: none; 
            width: 90%; 
            max-width: 500px; 
            padding: 2rem; 
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: var(--primary-accent);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--text-color); }
        .form-control {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--secondary-accent); }
        textarea.form-control { resize: vertical; min-height: 80px; }

        .btn-submit {
            width: 100%; padding: 1rem; background-color: var(--primary-accent); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: background-color 0.2s; margin-top: 1rem;
        }
        .btn-submit:hover { background-color: #172554; }
        .btn-submit:disabled { background-color: var(--text-light); cursor: not-allowed; }

    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo" onclick="window.location.href='index.html'">
            <div class="logo-icon">T</div>
            Tattva Nexus
        </div>
        <nav class="nav-menu">
            <div class="nav-item" onclick="window.location.href='dashboard.html'"><span class="nav-icon">📊</span> Dashboard</div>
            <div class="nav-item" onclick="window.location.href='gigs.html'"><span class="nav-icon">💼</span> Gigs</div>
            <div class="nav-item active" onclick="window.location.href='notes.html'"><span class="nav-icon">📚</span> Notes</div>
            <div class="nav-item" onclick="window.location.href='marketplace.html'"><span class="nav-icon">🛒</span> Marketplace</div>
            <div class="nav-item" onclick="window.location.href='events.html'"><span class="nav-icon">📅</span> Events</div>
            <div class="nav-item" onclick="window.location.href='community.html'"><span class="nav-icon">👥</span> Community</div>
            <div class="nav-item" onclick="window.location.href='messages.html'"><span class="nav-icon">💬</span> Messages</div>
            <div class="nav-item" onclick="window.location.href='profile.html'"><span class="nav-icon">👤</span> Profile</div>
        </nav>
    </aside>

    <!-- TOP HEADER -->
    <header class="top-header">
        <div class="page-title">Study Materials</div>
        <div class="header-actions">
            <button class="btn-add" id="btnOpenModal">
                <span>+</span> Add Entry
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- PRIME STANDARD 3: DUAL-VIEW FILTER LOGIC -->
        <div class="filter-bar">
            <button class="filter-btn active" id="btnAllItems">All Items</button>
            <button class="filter-btn" id="btnMyItems">My Items</button>
        </div>

        <div class="notes-grid" id="notesGrid">
            <div class="empty-state">Loading UI feed...</div>
        </div>
    </main>

    <!-- PRIME STANDARD 1: HARDCORE CSS MODAL ALIGNMENT -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="add-entry-modal" id="addEntryModal">
        <div class="modal-header">
            <h2>Upload Notes</h2>
            <button class="close-modal" id="btnCloseModal">&times;</button>
        </div>
        
        <div class="form-group">
            <label for="noteTitle">Document Title</label>
            <input type="text" id="noteTitle" class="form-control" placeholder="e.g., Chapter 1 Dynamics Notes" required>
        </div>

        <div class="form-group">
            <label for="noteSubject">Subject Name</label>
            <input type="text" id="noteSubject" class="form-control" placeholder="e.g., Engineering Mechanics" required>
        </div>

        <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label for="noteCode">Subject Code</label>
                <input type="text" id="noteCode" class="form-control" placeholder="e.g., ME101" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="noteDept">Department</label>
                <input type="text" id="noteDept" class="form-control" placeholder="e.g., Mechanical" required>
            </div>
        </div>

        <div class="form-group">
            <label for="noteDesc">Description</label>
            <textarea id="noteDesc" class="form-control" placeholder="Briefly describe the contents of these notes..."></textarea>
        </div>

        <div class="form-group">
            <label for="noteFile">Upload File (PDF/Docs)</label>
            <input type="file" id="noteFile" class="form-control" accept=".pdf,.doc,.docx,.ppt,.pptx" required>
        </div>

        <button id="btnSubmitEntry" class="btn-submit">Upload & Save</button>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        // FIRESTORE IMPORTS
        import { 
            getFirestore, collection, addDoc, onSnapshot, query, where, serverTimestamp, getDoc, doc 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        // STORAGE IMPORTS
        import { 
            getStorage, ref as storageRef, uploadBytes, getDownloadURL 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLo9rfV279AoHGGs3HheHgYQ5EgLcCzJo",
            authDomain: "tattva-nexus.firebaseapp.com",
            projectId: "tattva-nexus",
            storageBucket: "tattva-nexus.firebasestorage.app",
            messagingSenderId: "275334528",
            appId: "1:275334528:web:48a4d050fdb91c1c142d65"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // UI References
        const btnOpenModal = document.getElementById('btnOpenModal');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const addEntryModal = document.getElementById('addEntryModal');
        const btnSubmitEntry = document.getElementById('btnSubmitEntry');
        
        const btnAllItems = document.getElementById('btnAllItems');
        const btnMyItems = document.getElementById('btnMyItems');
        const notesGrid = document.getElementById('notesGrid');

        // Form Inputs
        const noteTitle = document.getElementById('noteTitle');
        const noteSubject = document.getElementById('noteSubject');
        const noteCode = document.getElementById('noteCode');
        const noteDept = document.getElementById('noteDept');
        const noteDesc = document.getElementById('noteDesc');
        const noteFile = document.getElementById('noteFile');

        // State variables
        let currentUser = null;
        let currentUserName = "Student Contributor";
        let currentFilter = 'all'; 
        let unsubscribeFeed = null;

        // AUTH & INIT
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                
                // Fetch user name
                const userDoc = await getDoc(doc(db, "users", currentUser.uid));
                if (userDoc.exists() && userDoc.data().firstName) {
                    currentUserName = `${userDoc.data().firstName} ${userDoc.data().lastName || ''}`.trim();
                } else if (user.email) {
                    currentUserName = user.email.split('@')[0];
                }

                loadNotesFeed();
            } else {
                window.location.href = "login.html";
            }
        });

        // MODAL TOGGLES
        btnOpenModal.onclick = () => {
            modalOverlay.style.display = 'block';
            addEntryModal.style.display = 'block';
        };

        const closeModal = () => {
            modalOverlay.style.display = 'none';
            addEntryModal.style.display = 'none';
            // Clear inputs
            noteTitle.value = '';
            noteSubject.value = '';
            noteCode.value = '';
            noteDept.value = '';
            noteDesc.value = '';
            noteFile.value = '';
        };

        btnCloseModal.onclick = closeModal;
        modalOverlay.onclick = closeModal;

        // PRIME STANDARD 2: FIRESTORE & STORAGE SYNC
        btnSubmitEntry.onclick = async () => {
            const file = noteFile.files[0];
            const titleVal = noteTitle.value.trim();
            const subjectVal = noteSubject.value.trim();
            const codeVal = noteCode.value.trim().toUpperCase();
            const deptVal = noteDept.value.trim();
            const descVal = noteDesc.value.trim();

            if (!file || !titleVal || !subjectVal) {
                alert("Please fill in Title, Subject, and upload a File.");
                return;
            }

            btnSubmitEntry.innerText = "Uploading to Storage...";
            btnSubmitEntry.disabled = true;

            try {
                // 1. Upload File to Firebase Storage FIRST
                const fileRef = storageRef(storage, `notes/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(fileRef, file);
                
                // 2. Wait for downloadURL
                const downloadURL = await getDownloadURL(snapshot.ref);
                
                btnSubmitEntry.innerText = "Saving to Firestore...";

                // 3. Save downloadURL and data to Firestore collection
                await addDoc(collection(db, "notes"), {
                    uid: currentUser.uid,
                    uploaderName: currentUserName,
                    title: titleVal,
                    subject: subjectVal,
                    subjectCode: codeVal,
                    dept: deptVal,
                    description: descVal,
                    fileUrl: downloadURL,
                    createdAt: serverTimestamp()
                });

                closeModal();
            } catch (error) {
                console.error("Error creating entry:", error);
                alert("Failed to upload. Please try again.");
            } finally {
                btnSubmitEntry.innerText = "Upload & Save";
                btnSubmitEntry.disabled = false;
            }
        };

        // PRIME STANDARD 3: DUAL-VIEW FILTER LOGIC
        btnAllItems.onclick = () => {
            if (currentFilter === 'all') return;
            currentFilter = 'all';
            btnAllItems.classList.add('active');
            btnMyItems.classList.remove('active');
            loadNotesFeed();
        };

        btnMyItems.onclick = () => {
            if (currentFilter === 'mine') return;
            currentFilter = 'mine';
            btnMyItems.classList.add('active');
            btnAllItems.classList.remove('active');
            loadNotesFeed();
        };

        // UI FEED WITH onSnapshot
        function loadNotesFeed() {
            if (unsubscribeFeed) {
                unsubscribeFeed(); // Cleanup previous listener
            }

            const colRef = collection(db, "notes");
            let q;

            if (currentFilter === 'mine') {
                // query(collection(db, "COLLECTION_NAME"), where("uid", "==", currentUser.uid))
                q = query(colRef, where("uid", "==", currentUser.uid));
            } else {
                q = query(colRef);
            }

            // Real-time listener updates UI feed instantly
            unsubscribeFeed = onSnapshot(q, (snapshot) => {
                notesGrid.innerHTML = '';

                if (snapshot.empty) {
                    notesGrid.innerHTML = `
                        <div class="empty-state">
                            <h3>No notes found</h3>
                            <p>Be the first to share study materials!</p>
                        </div>
                    `;
                    return;
                }

                const items = [];
                snapshot.forEach(docSnap => {
                    items.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Client-side sort
                items.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : Date.now();
                    const timeB = b.createdAt ? b.createdAt.toMillis() : Date.now();
                    return timeB - timeA; 
                });

                items.forEach(item => renderNoteCard(item));
            }, (error) => {
                console.error("Error listening to feed:", error);
                notesGrid.innerHTML = `<div class="empty-state">Error loading feed.</div>`;
            });
        }

        function renderNoteCard(item) {
            const card = document.createElement('div');
            card.className = 'note-card';

            const author = item.uploaderName || "Student";
            const code = item.subjectCode || "N/A";
            const dept = item.dept || "General";
            const desc = item.description || "No description provided.";

            card.innerHTML = `
                <div class="note-header">
                    <div class="note-title" title="${item.title}">${item.title}</div>
                    <div class="meta-tags">
                        <span class="tag">${code}</span>
                        <span class="tag">${item.subject}</span>
                        <span class="tag tag-dept">${dept}</span>
                    </div>
                </div>
                <div class="note-desc">${desc}</div>
                <div class="note-footer">
                    <div class="author-info">
                        <span>👤 ${author}</span>
                    </div>
                    <a href="${item.fileUrl}" target="_blank" class="btn-download">Download</a>
                </div>
            `;

            notesGrid.appendChild(card);
        }
    </script>
    <script type="module" src="notifications.js"></script>
</body>
</html>
