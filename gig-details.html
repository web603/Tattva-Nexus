<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Gigs | Tattva Nexus</title>
    <style>
        /* ================================================================
           GLOBAL VARIABLES & BASE
           ================================================================ */
        :root {
            --bg-color: #f3f4f6;
            --card-color: #ffffff;
            --primary-accent: #1e3a8a;
            --secondary-accent: #3b82f6;
            --text-color: #111827;
            --text-light: #4b5563;
            --border-color: #e5e7eb;
            --sidebar-width: 260px;
            --header-height: 70px;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ================================================================
           SIDEBAR
           ================================================================ */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--card-color);
            border-right: 1px solid var(--border-color);
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-logo {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary-accent);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--secondary-accent);
            color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            font-weight: bold;
        }

        .nav-menu { padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; }
        
        .nav-item {
            display: flex; align-items: center; padding: 0.875rem 1rem; border-radius: 8px;
            color: var(--text-light); font-weight: 500; text-decoration: none; transition: all 0.3s;
            cursor: pointer;
        }
        .nav-item:hover { background-color: var(--bg-color); color: var(--primary-accent); }
        .nav-item.active { background-color: rgba(59, 130, 246, 0.1); color: var(--secondary-accent); border-right: 3px solid var(--secondary-accent); border-top-right-radius: 0; border-bottom-right-radius: 0; }
        .nav-icon { margin-right: 12px; font-size: 1.1rem; }

        /* ================================================================
           HEADER
           ================================================================ */
        .top-header {
            position: fixed; top: 0; left: var(--sidebar-width); right: 0; height: var(--header-height);
            background-color: var(--card-color); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; z-index: 90;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-add {
            background-color: var(--secondary-accent);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-add:hover {
            background-color: var(--primary-accent);
        }

        /* ================================================================
           MAIN CONTENT & FILTERS
           ================================================================ */
        .main-content {
            margin-left: var(--sidebar-width); 
            margin-top: var(--header-height); 
            padding: 2rem;
            width: calc(100% - var(--sidebar-width));
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .filter-btn {
            padding: 0.6rem 1.5rem;
            border: 1px solid var(--primary-accent);
            border-radius: 20px;
            background-color: transparent;
            color: var(--primary-accent);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: var(--primary-accent);
            color: white;
        }

        /* ================================================================
           GIGS GRID
           ================================================================ */
        .gigs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .gig-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .gig-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .gig-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }

        .gig-details {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .gig-author {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .author-avatar-small {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: var(--secondary-accent);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .gig-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .gig-meta-info {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--secondary-accent);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .gig-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #f3f4f6;
        }

        .gig-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-color);
        }

        .gig-delivery {
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .loading-state, .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
            font-size: 1.1rem;
            background: var(--card-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        /* ================================================================
           PRIME STANDARD 1: HARDCORE CSS MODAL ALIGNMENT
           ================================================================ */
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(8px); 
            z-index: 9998; 
            display: none; 
        }

        .add-entry-modal { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 9999; 
            background: #fff; 
            max-height: 90vh; 
            overflow-y: auto; 
            display: none; 
            
            /* Aesthetics */
            width: 90%;
            max-width: 550px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: var(--primary-accent);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--secondary-accent);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-color: #172554;
        }

        .btn-submit:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
        }

    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo" onclick="window.location.href='index.html'">
            <div class="logo-icon">T</div>
            Tattva Nexus
        </div>
        <nav class="nav-menu">
            <div class="nav-item" onclick="window.location.href='dashboard.html'"><span class="nav-icon">📊</span> Dashboard</div>
            <div class="nav-item active" onclick="window.location.href='gigs.html'"><span class="nav-icon">💼</span> Gigs</div>
            <div class="nav-item" onclick="window.location.href='notes.html'"><span class="nav-icon">📚</span> Notes</div>
            <div class="nav-item" onclick="window.location.href='marketplace.html'"><span class="nav-icon">🛒</span> Marketplace</div>
            <div class="nav-item" onclick="window.location.href='events.html'"><span class="nav-icon">📅</span> Events</div>
            <div class="nav-item" onclick="window.location.href='community.html'"><span class="nav-icon">👥</span> Community</div>
            <div class="nav-item" onclick="window.location.href='messages.html'"><span class="nav-icon">💬</span> Messages</div>
            <div class="nav-item" onclick="window.location.href='profile.html'"><span class="nav-icon">👤</span> Profile</div>
        </nav>
    </aside>

    <!-- HEADER -->
    <header class="top-header">
        <div class="page-title">Freelance Gigs</div>
        <div class="header-actions">
            <button class="btn-add" id="btnOpenModal">
                <span>+</span> Post a Gig
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- PRIME STANDARD 3: DUAL-VIEW FILTER LOGIC -->
        <div class="filter-bar">
            <button class="filter-btn active" id="btnAllItems">All Gigs</button>
            <button class="filter-btn" id="btnMyItems">My Gigs</button>
        </div>

        <div class="gigs-grid" id="gigsGrid">
            <div class="loading-state">Loading UI feed...</div>
        </div>
    </main>

    <!-- PRIME STANDARD 1: HARDCORE CSS MODAL -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="add-entry-modal" id="addEntryModal">
        <div class="modal-header">
            <h2>Offer a Service</h2>
            <button class="close-modal" id="btnCloseModal">&times;</button>
        </div>
        
        <div class="form-group">
            <label for="gigTitle">Gig Title</label>
            <input type="text" id="gigTitle" class="form-control" placeholder="I will design a modern logo for you" required>
        </div>

        <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label for="gigCategory">Category</label>
                <select id="gigCategory" class="form-control" required>
                    <option value="Design">Design & Graphics</option>
                    <option value="Tech">Tech & Programming</option>
                    <option value="Writing">Writing & Translation</option>
                    <option value="Tutoring">Academic Tutoring</option>
                    <option value="Other">Other Services</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="gigDelivery">Delivery Time</label>
                <select id="gigDelivery" class="form-control" required>
                    <option value="1 Day">1 Day</option>
                    <option value="2 Days">2 Days</option>
                    <option value="3 Days">3 Days</option>
                    <option value="1 Week">1 Week</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="gigPrice">Starting Price (₹)</label>
            <input type="number" id="gigPrice" class="form-control" placeholder="e.g., 999" required>
        </div>

        <div class="form-group">
            <label for="gigDescription">Description</label>
            <textarea id="gigDescription" class="form-control" placeholder="Detail the services you are offering, your experience, and what the buyer gets..."></textarea>
        </div>

        <div class="form-group">
            <label for="gigImage">Cover Image</label>
            <input type="file" id="gigImage" class="form-control" accept="image/*" required>
        </div>

        <button id="btnSubmitEntry" class="btn-submit">Publish Gig</button>
    </div>

    <!-- APPWRITE LOGIC -->
    <script type="module">
        import { Client, Account, Databases, Storage, Query, ID } from "https://cdn.jsdelivr.net/npm/appwrite@14.0.1/+esm";

        // Configuration setup
        const APPWRITE_ENDPOINT = "https://sgp.cloud.appwrite.io/v1";
        const APPWRITE_PROJECT_ID = "6a21633800287cda70c6";
        const APPWRITE_DB_ID = "6a21640d001592135482";
        const APPWRITE_COL_PROFILES = "profiles";
        const APPWRITE_COL_GIGS = "gigs";
        const APPWRITE_BUCKET_ID = "gig_media"; // Make sure to configure this storage bucket in your Appwrite Console

        // Initialize Appwrite Client
        const client = new Client()
            .setEndpoint(APPWRITE_ENDPOINT)
            .setProject(APPWRITE_PROJECT_ID);

        const account = new Account(client);
        const db = new Databases(client);
        const storage = new Storage(client);

        // UI References
        const btnOpenModal = document.getElementById('btnOpenModal');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const addEntryModal = document.getElementById('addEntryModal');
        const btnSubmitEntry = document.getElementById('btnSubmitEntry');
        
        const btnAllItems = document.getElementById('btnAllItems');
        const btnMyItems = document.getElementById('btnMyItems');
        const gigsGrid = document.getElementById('gigsGrid');

        // Form Inputs
        const gigTitle = document.getElementById('gigTitle');
        const gigCategory = document.getElementById('gigCategory');
        const gigDelivery = document.getElementById('gigDelivery');
        const gigPrice = document.getElementById('gigPrice');
        const gigDescription = document.getElementById('gigDescription');
        const gigImage = document.getElementById('gigImage');

        // State variables
        let currentUser = null;
        let currentUserName = "Freelancer";
        let currentFilter = 'all'; 
        let unsubscribeFeed = null;

        // AUTH & INIT
        async function checkAuth() {
            try {
                const user = await account.get();
                currentUser = user;
                
                try {
                    // Fetch user profile data
                    const userDoc = await db.getDocument(APPWRITE_DB_ID, APPWRITE_COL_PROFILES, currentUser.$id);
                    if (userDoc && userDoc.firstName) {
                        currentUserName = `${userDoc.firstName} ${userDoc.lastName || ''}`.trim();
                    } else if (user.email) {
                        currentUserName = user.email.split('@')[0];
                    }
                } catch (e) {
                    console.error("Profiles look up failed:", e);
                    currentUserName = user.email ? user.email.split('@')[0] : "Freelancer";
                }

                loadGigsFeed();
            } catch (error) {
                console.error("Auth routing redirect:", error);
                window.location.href = "login.html";
            }
        }

        checkAuth();

        // MODAL TOGGLES
        btnOpenModal.onclick = () => {
            modalOverlay.style.display = 'block';
            addEntryModal.style.display = 'block';
        };

        const closeModal = () => {
            modalOverlay.style.display = 'none';
            addEntryModal.style.display = 'none';
            // Clear inputs
            gigTitle.value = '';
            gigCategory.value = 'Design';
            gigDelivery.value = '1 Day';
            gigPrice.value = '';
            gigDescription.value = '';
            gigImage.value = '';
        };

        btnCloseModal.onclick = closeModal;
        modalOverlay.onclick = closeModal;

        // --- PRIME STANDARD 2: FIRESTORE & STORAGE SYNC ---
        btnSubmitEntry.onclick = async () => {
            const file = gigImage.files[0];
            const titleVal = gigTitle.value.trim();
            const catVal = gigCategory.value;
            const delVal = gigDelivery.value;
            const priceVal = gigPrice.value.trim();
            const descVal = gigDescription.value.trim();

            if (!file || !titleVal || !priceVal) {
                alert("Please fill in Title, Price, and upload a Cover Image.");
                return;
            }

            btnSubmitEntry.innerText = "Uploading to Storage...";
            btnSubmitEntry.disabled = true;

            try {
                // 1. Upload Cover Image to Appwrite storage bucket
                const uploadResponse = await storage.createFile(
                    APPWRITE_BUCKET_ID,
                    ID.unique(),
                    file
                );
                
                // 2. Wait for displayURL
                const downloadURL = storage.getFileView(APPWRITE_BUCKET_ID, uploadResponse.$id).href;
                
                btnSubmitEntry.innerText = "Saving to Appwrite...";

                // 3. Save details document inside Database Collection
                await db.createDocument(
                    APPWRITE_DB_ID,
                    APPWRITE_COL_GIGS,
                    ID.unique(),
                    {
                        uid: currentUser.$id,
                        authorUid: currentUser.$id,
                        authorName: currentUserName,
                        title: titleVal,
                        category: catVal,
                        deliveryTime: delVal,
                        price: Number(priceVal),
                        description: descVal,
                        imageUrl: downloadURL,
                        createdAt: new Date().toISOString()
                    }
                );

                closeModal();
            } catch (error) {
                console.error("Error creating gig entry inside Appwrite:", error);
                alert("Failed to publish gig. Please check your attribute layouts.");
            } finally {
                btnSubmitEntry.innerText = "Publish Gig";
                btnSubmitEntry.disabled = false;
            }
        };

        // --- PRIME STANDARD 3: DUAL-VIEW FILTER LOGIC ---
        btnAllItems.onclick = () => {
            if (currentFilter === 'all') return;
            currentFilter = 'all';
            btnAllItems.classList.add('active');
            btnMyItems.classList.remove('active');
            loadGigsFeed();
        };

        btnMyItems.onclick = () => {
            if (currentFilter === 'mine') return;
            currentFilter = 'mine';
            btnMyItems.classList.add('active');
            btnAllItems.classList.remove('active');
            loadGigsFeed();
        };

        // UI FEED WITH REAL-TIME LISTENER
        function loadGigsFeed() {
            if (unsubscribeFeed) {
                unsubscribeFeed(); // Cleanup previous listener
                unsubscribeFeed = null;
            }

            async function fetchAndRender() {
                try {
                    let queries = [
                        Query.limit(100)
                    ];

                    if (currentFilter === 'mine') {
                        queries.push(Query.equal("uid", currentUser.$id));
                    }

                    const response = await db.listDocuments(
                        APPWRITE_DB_ID,
                        APPWRITE_COL_GIGS,
                        queries
                    );

                    gigsGrid.innerHTML = '';

                    if (response.documents.length === 0) {
                        gigsGrid.innerHTML = `
                            <div class="empty-state">
                                <h3>No gigs found</h3>
                                <p>Try switching filters or offer a new service.</p>
                            </div>
                        `;
                        return;
                    }

                    // Client-side sort descending by createdAt ISO string
                    const items = response.documents;
                    items.sort((a, b) => {
                        const timeA = a.createdAt ? new Date(a.createdAt).getTime() : Date.now();
                        const timeB = b.createdAt ? new Date(b.createdAt).getTime() : Date.now();
                        return timeB - timeA;
                    });

                    items.forEach(item => {
                        renderGigCard(item);
                    });
                } catch (error) {
                    console.error("Error retrieving gigs from Appwrite:", error);
                    gigsGrid.innerHTML = `<div class="empty-state">Error loading feed. Check collection configuration.</div>`;
                }
            }

            // Perform initial feed load
            fetchAndRender();

            // Real-time listener updates cards instantly without refresh
            try {
                unsubscribeFeed = client.subscribe(
                    `databases.${APPWRITE_DB_ID}.collections.${APPWRITE_COL_GIGS}.documents`,
                    (response) => {
                        const events = response.events;
                        if (events.some(e => e.includes('.create') || e.includes('.update') || e.includes('.delete'))) {
                            fetchAndRender();
                        }
                    }
                );
            } catch (err) {
                console.error("Realtime subscription initialization failed:", err);
            }
        }

        function renderGigCard(item) {
            const card = document.createElement('div');
            card.className = 'gig-card';
            
            // Redirect to Details View securely via document ID URL parameter
            card.onclick = () => {
                window.location.href = `gig-details.html?id=${item.$id}`;
            };

            const fallbackImg = "https://images.unsplash.com/photo-1516321497487-e288fb19713f?q=80&w=2070&auto=format&fit=crop";
            const imgSrc = item.imageUrl || fallbackImg;
            const author = item.authorName || "Freelancer";
            const authorInit = author.charAt(0).toUpperCase();
            const priceStr = item.price ? `₹${item.price}` : 'Custom Pricing';

            card.innerHTML = `
                <img src="${imgSrc}" alt="${item.title}" class="gig-image" onerror="this.src='${fallbackImg}'">
                <div class="gig-details">
                    <div class="gig-author">
                        <div class="author-avatar-small">${authorInit}</div>
                        <span>${author}</span>
                    </div>
                    
                    <div class="gig-title" title="${item.title}">${item.title}</div>
                    
                    <div class="gig-meta-info">
                        <span class="tag">${item.category || 'Service'}</span>
                    </div>
                    
                    <div class="gig-footer">
                        <div class="gig-price">From ${priceStr}</div>
                        <div class="gig-delivery">⏱ ${item.deliveryTime || 'Standard'}</div>
                    </div>
                </div>
            `;

            gigsGrid.appendChild(card);
        }
    </script>
    <script type="module" src="notifications.js"></script>
</body>
</html>
