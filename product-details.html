<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Tattva Nexus</title>
    <style>
        /* ================================================================
           GLOBAL VARIABLES
           ================================================================ */
        :root {
            --bg-color: #f3f4f6;
            --card-color: #ffffff;
            --primary-accent: #1e3a8a;
            --secondary-accent: #3b82f6;
            --text-color: #111827;
            --text-light: #4b5563;
            --border-color: #e5e7eb;
            --sidebar-width: 260px;
            --header-height: 70px;
            --transition-speed: 0.3s;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ================================================================
           SIDEBAR (PERSISTENT FROM MARKETPLACE)
           ================================================================ */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--card-color);
            border-right: 1px solid var(--border-color);
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-logo {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary-accent);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--secondary-accent);
            color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            font-weight: bold;
        }

        .nav-menu { padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        
        .nav-item {
            display: flex; align-items: center; padding: 0.875rem 1rem; border-radius: 8px;
            color: var(--text-light); font-weight: 500; text-decoration: none; transition: all 0.3s;
            cursor: pointer;
        }
        .nav-item:hover { background-color: var(--bg-color); color: var(--primary-accent); }
        .nav-item.active { background-color: rgba(59, 130, 246, 0.1); color: var(--secondary-accent); border-right: 3px solid var(--secondary-accent); border-top-right-radius: 0; border-bottom-right-radius: 0; }

        /* ================================================================
           HEADER & NOTIFICATIONS
           ================================================================ */
        .top-header {
            position: fixed; top: 0; left: var(--sidebar-width); right: 0; height: var(--header-height);
            background-color: var(--card-color); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; z-index: 90;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .back-btn:hover { background: var(--bg-color); color: var(--primary-accent); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .notification-btn {
            position: relative;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .notification-dot {
            position: absolute;
            top: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background-color: var(--danger-color);
            border-radius: 50%;
            border: 2px solid var(--card-color);
            display: none; /* toggled via JS */
        }

        /* ================================================================
           PRODUCT DETAILS LAYOUT
           ================================================================ */
        .main-content {
            margin-left: var(--sidebar-width); 
            margin-top: var(--header-height); 
            padding: 2rem;
            width: calc(100% - var(--sidebar-width));
            display: flex;
            justify-content: center;
        }

        .details-wrapper {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            display: none; /* Shown after load */
        }

        /* Product Hero */
        .product-hero {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-hero-img {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            background-color: #f9fafb;
            border-bottom: 1px solid var(--border-color);
        }

        .product-hero-info {
            padding: 2rem;
        }

        .product-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .product-price-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .product-price {
            font-size: 2rem;
            font-weight: 800;
            color: var(--secondary-accent);
        }

        .product-badges {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #e0e7ff;
            color: var(--primary-accent);
        }

        .product-description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-light);
            white-space: pre-line;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        /* Seller Card & Actions */
        .sidebar-right {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .seller-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .seller-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--primary-accent);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .seller-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 0.25rem;
        }

        .verified-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--success-color);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .seller-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            width: 100%;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .action-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            width: 100%;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            border: none;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover { opacity: 0.9; }
        
        .btn-primary { background-color: var(--secondary-accent); color: white; }
        .btn-secondary { background-color: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-danger { background-color: #fee2e2; color: var(--danger-color); border: 1px solid #fca5a5; }

        /* Status States */
        .loading-state, .error-state {
            width: 100%;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
            font-size: 1.2rem;
            background: var(--card-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            grid-column: 1 / -1;
        }

        .error-state {
            color: var(--danger-color);
            display: none;
        }

        @media (max-width: 900px) {
            .details-wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo" onclick="window.location.href='index.html'">
            <div class="logo-icon">T</div>
            Tattva Nexus
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">📊</span> Dashboard
            </a>
            <a href="marketplace.html" class="nav-item active">
                <span class="nav-icon">🛒</span> Marketplace
            </a>
            <a href="messages.html" class="nav-item">
                <span class="nav-icon">💬</span> Messages
            </a>
        </nav>
    </aside>

    <!-- HEADER -->
    <header class="top-header">
        <div class="page-title">
            <button class="back-btn" onclick="window.location.href='marketplace.html'">←</button>
            Listing Details
        </div>
        <div class="header-actions">
            <button class="notification-btn" id="bellIcon">
                🔔
                <span class="notification-dot" id="unreadDot"></span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="loading-state" id="loadingState">Fetching product details...</div>
        <div class="error-state" id="errorState">Product not found or has been removed.</div>

        <div class="details-wrapper" id="detailsWrapper">
            
            <!-- LEFT COLUMN: Product Hero -->
            <div class="product-hero">
                <img src="" alt="Product Image" id="uiProductImg" class="product-hero-img">
                <div class="product-hero-info">
                    <h1 class="product-title" id="uiProductTitle">Loading...</h1>
                    <div class="product-price-row">
                        <div class="product-price" id="uiProductPrice">₹0</div>
                        <div class="product-badges">
                            <span class="badge" id="uiProductCategory">Category</span>
                            <span class="badge">Condition: Very Good</span>
                        </div>
                    </div>
                    <div class="product-description" id="uiProductDesc">
                        Loading description...
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Seller Card & Actions -->
            <div class="sidebar-right">
                
                <div class="seller-card">
                    <div class="seller-avatar" id="uiSellerAvatar">?</div>
                    <div class="seller-name" id="uiSellerName">Member Name</div>
                    <div class="verified-badge">
                        ✅ Verified Member
                    </div>
                    <div class="seller-meta" id="uiSellerJoinDate">
                        Joined: Loading...
                    </div>
                </div>

                <div class="action-card" id="uiActionContainer">
                    <!-- Dynamic Buttons injected here -->
                </div>

            </div>

        </div>
    </main>

    <!-- FIREBASE V9+ SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, deleteDoc, collection, query, where, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLo9rfV279AoHGGs3HheHgYQ5EgLcCzJo",
            authDomain: "tattva-nexus.firebaseapp.com",
            projectId: "tattva-nexus",
            storageBucket: "tattva-nexus.firebasestorage.app",
            messagingSenderId: "275334528",
            appId: "1:275334528:web:48a4d050fdb91c1c142d65"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI References
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const detailsWrapper = document.getElementById('detailsWrapper');
        
        const uiProductImg = document.getElementById('uiProductImg');
        const uiProductTitle = document.getElementById('uiProductTitle');
        const uiProductPrice = document.getElementById('uiProductPrice');
        const uiProductCategory = document.getElementById('uiProductCategory');
        const uiProductDesc = document.getElementById('uiProductDesc');
        
        const uiSellerAvatar = document.getElementById('uiSellerAvatar');
        const uiSellerName = document.getElementById('uiSellerName');
        const uiSellerJoinDate = document.getElementById('uiSellerJoinDate');
        const uiActionContainer = document.getElementById('uiActionContainer');
        const unreadDot = document.getElementById('unreadDot');

        // State
        let currentUser = null;
        let productId = null;

        // 1. EXTRACT ID FROM URL
        const params = new URLSearchParams(window.location.search);
        productId = params.get('id');

        // 2. AUTHENTICATION LISTENER
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                if (!productId) {
                    showError("Invalid product link.");
                    return;
                }
                fetchProductAndSellerData();
                listenForUnreadMessages();
            } else {
                window.location.href = "login.html";
            }
        });

        // 3. DOUBLE FETCH LOGIC
        async function fetchProductAndSellerData() {
            try {
                // Fetch 1: Product Document
                const productRef = doc(db, "marketplace", productId);
                const productSnap = await getDoc(productRef);

                if (!productSnap.exists()) {
                    showError("This item does not exist or has been removed.");
                    return;
                }

                const productData = productSnap.data();
                const sellerUid = productData.uid;

                // Fetch 2: Seller User Document
                const sellerRef = doc(db, "users", sellerUid);
                const sellerSnap = await getDoc(sellerRef);
                const sellerData = sellerSnap.exists() ? sellerSnap.data() : null;

                // Populate UI
                renderUI(productData, sellerData, sellerUid);

            } catch (error) {
                console.error("Error fetching data:", error);
                showError("An error occurred while loading details.");
            }
        }

        // 4. RENDER UI & DYNAMIC BUTTONS
        function renderUI(product, seller, sellerUid) {
            // Hide loading, show wrapper
            loadingState.style.display = 'none';
            detailsWrapper.style.display = 'grid';

            // Populate Product
            const fallbackImg = "https://images.unsplash.com/photo-1512428559087-560fa5ceab42?w=800&auto=format&fit=crop";
            uiProductImg.src = product.imageUrl || fallbackImg;
            uiProductImg.onerror = () => { uiProductImg.src = fallbackImg; };
            
            uiProductTitle.textContent = product.title || "Untitled Item";
            uiProductPrice.textContent = product.price ? `₹${product.price}` : "Free";
            uiProductCategory.textContent = product.category || "General";
            uiProductDesc.textContent = product.description || "No detailed description provided by the seller.";

            // Populate Seller
            let sName = product.sellerName || "Campus Member"; // Fallback from product doc
            let joinStr = "Recent";
            
            if (seller) {
                if (seller.firstName) {
                    sName = `${seller.firstName} ${seller.lastName || ''}`.trim();
                }
                if (seller.createdAt) {
                    const date = seller.createdAt.toDate();
                    joinStr = date.toLocaleDateString([], { month: 'long', year: 'numeric' });
                }
            }

            uiSellerName.textContent = sName;
            uiSellerAvatar.textContent = sName.charAt(0).toUpperCase();
            uiSellerJoinDate.textContent = `Joined: ${joinStr}`;

            // INTERACTIVE LOGIC: DYNAMIC BUTTONS
            uiActionContainer.innerHTML = ''; // Clear existing

            if (currentUser.uid === sellerUid) {
                // Owner View
                uiActionContainer.innerHTML = `
                    <button class="btn btn-secondary" id="btnEditItem">✏️ Edit Listing</button>
                    <button class="btn btn-danger" id="btnDeleteItem">🗑️ Delete Item</button>
                `;

                document.getElementById('btnEditItem').onclick = () => {
                    alert("Edit functionality would open a modal here.");
                };

                document.getElementById('btnDeleteItem').onclick = async () => {
                    if(confirm("Are you sure you want to permanently delete this item?")) {
                        try {
                            await deleteDoc(doc(db, "marketplace", productId));
                            alert("Item deleted successfully.");
                            window.location.href = "marketplace.html";
                        } catch (err) {
                            console.error(err);
                            alert("Failed to delete item.");
                        }
                    }
                };
            } else {
                // Buyer View
                uiActionContainer.innerHTML = `
                    <button class="btn btn-primary" id="btnMessageSeller">💬 Message Seller</button>
                `;

                document.getElementById('btnMessageSeller').onclick = () => {
                    window.location.href = `messages.html?chatWith=${sellerUid}`;
                };
            }
        }

        // Helper: Show Error
        function showError(msg) {
            loadingState.style.display = 'none';
            detailsWrapper.style.display = 'none';
            errorState.style.display = 'block';
            errorState.textContent = msg;
        }

        // Notification Red Dot Logic
        function listenForUnreadMessages() {
            if (!currentUser) return;
            const chatsRef = collection(db, "chats");
            // Find chats where current user is a participant
            const q = query(chatsRef, where("participants", "array-contains", currentUser.uid));
            
            onSnapshot(q, (snapshot) => {
                let hasUnread = false;
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    // If lastMessage is NOT sent by currentUser AND is read===false
                    if (data.lastMessageSenderId && data.lastMessageSenderId !== currentUser.uid && data.read === false) {
                        hasUnread = true;
                    }
                });
                
                unreadDot.style.display = hasUnread ? "block" : "none";
            });
        }
    </script>
    <script type="module" src="notifications.js"></script>
</body>
</html>
